name: TAFITA MADA V1.0 - Android APK Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Recreate Clean Capacitor Android Platform
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          echo 'import { CapacitorConfig } from "@capacitor/cli"; const config: CapacitorConfig = { appId: "com.tafitamada.app", appName: "Tafita Mada", webDir: "dist" }; export default config;' > capacitor.config.ts
          
          # Fafana ny fampirimana android taloha
          rm -rf android
          
          # Foronina vaovao madio tanteraka
          npx cap add android
          npx cap sync android

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          echo "
          configurations.all {
              resolutionStrategy {
                  force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22'
                  force 'org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22'
              }
          }
          " >> android/build.gradle

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TafitaMada-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
