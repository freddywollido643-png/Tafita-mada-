name: TAFITA MADA V1.0 - Android APK Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Dependencies & Build Web Bundle
        run: |
          npm install
          npm run build

      - name: Setup Capacitor for Mobile
        run: |
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap init "Tafita Mada" "com.tafitamada.app" --web-dir=dist
          npx cap add android

      - name: Grant Execute Permission for Gradle
        run: chmod +x android/gradlew

      - name: Build Android APK (Debug)
        run: |
          cd android && ./gradlew assembleDebug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TafitaMada-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
