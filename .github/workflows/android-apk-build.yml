name: TAFITA MADA V1.0 - Android APK Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          # Mitady ny build.gradle ao amin'ny app mba hanesorana ny olan'ny dika mitovy amin'ny Kotlin
          GRADLE_PATH=$(find . -name "build.gradle" | grep "app" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            echo "
            dependencies {
                modules {
                    module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') {
                        replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use stdlib instead of jdk7')
                    }
                    module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') {
                        replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use stdlib instead of jdk8')
                    }
                }
            }
            " >> "$GRADLE_PATH"
          fi

      - name: Grant Execute Permission for Gradle Wrapper
        run: |
          chmod +x ./gradlew || chmod +x android/gradlew || true

      - name: Build Android APK
        run: |
          if [ -f "./gradlew" ]; then
            ./gradlew assembleDebug --no-daemon
          elif [ -f "android/gradlew" ]; then
            cd android && ./gradlew assembleDebug --no-daemon
          else
            echo "Tsy hita ny gradlew!"
            exit 1
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TafitaMada-v1.0-APK
          path: "**/build/outputs/apk/debug/*.apk"
