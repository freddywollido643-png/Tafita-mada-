name: TAFITA MADA V1.0 - Android APK Build Pipeline

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build Web Assets
        run: |
          npm install
          npm run build

      - name: Fix Kotlin Duplicate Dependencies
        run: |
          GRADLE_PATH=$(find . -name "build.gradle" | grep "app" | head -n 1)
          if [ -n "$GRADLE_PATH" ]; then
            echo "
            dependencies {
                modules {
                    module('org.jetbrains.kotlin:kotlin-stdlib-jdk7') {
                        replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use stdlib instead of jdk7')
                    }
                    module('org.jetbrains.kotlin:kotlin-stdlib-jdk8') {
                        replacedBy('org.jetbrains.kotlin:kotlin-stdlib', 'Use stdlib instead of jdk8')
                    }
                }
            }
            " >> "$GRADLE_PATH"
          fi

      - name: Generate Gradle Wrapper if Missing
        run: |
          # Raha ao amin'ny fampirimana android no misy ny tetikasa dia ao no mamorona gradlew
          if [ -d "android" ]; then
            cd android
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          else
            gradle wrapper --gradle-version 8.2
            chmod +x gradlew
          fi

      - name: Build Android APK
        run: |
          if [ -d "android" ]; then
            cd android && ./gradlew assembleDebug --no-daemon
          else
            ./gradlew assembleDebug --no-daemon
          fi

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TafitaMada-v1.0-APK
          path: "**/build/outputs/apk/debug/*.apk"
